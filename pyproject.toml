[project]
name = "reelgen"
version = "0.1.0"
description = "Automated short-form science explainer reel pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "faster-whisper>=1.2.1",
]

[project.scripts]
reelgen = "reelgen.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
